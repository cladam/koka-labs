name: Build, Test, and Release

permissions:
  contents: write # Required for creating releases and uploading assets

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Trigger on version tags like v0.1.0
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: koka-ls-linux-x86_64
          - os: macos-latest
            artifact: koka-ls-macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Koka
        run: |
          curl -sSL https://github.com/koka-lang/koka/releases/latest/download/install.sh | sudo sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Build (release)
        if: startsWith(github.ref, 'refs/tags/v')
        # Remove optimisation due to the segfault crash
        # koka -O2 src/ls.kk 2>&1 | tee build.log
        run: |
          koka src/ls.kk 2>&1 | tee build.log
          BINARY=$(grep '^created :' build.log | awk '{print $3}')
          cp "$BINARY" koka-ls
          chmod +x koka-ls

      - name: Build (debug)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          koka src/ls.kk 2>&1 | tee build.log
          BINARY=$(grep '^created :' build.log | awk '{print $3}')
          cp "$BINARY" koka-ls
          chmod +x koka-ls

      - name: Verify binary
        run: ./koka-ls --version

      - name: Run tests
        run: |
          koka tests/test-ls.kk 2>&1 | tee test-build.log
          TEST_BINARY=$(grep '^created :' test-build.log | awk '{print $3}')
          "$TEST_BINARY"

      - name: Compare with GNU ls
        run: |
          koka tests/compare-ls.kk 2>&1 | tee compare-build.log
          COMPARE_BINARY=$(grep '^created :' compare-build.log | awk '{print $3}')
          "$COMPARE_BINARY"

      - name: Strip binary (Linux)
        if: runner.os == 'Linux'
        run: strip koka-ls

      - name: Ad-hoc codesign (macOS)
        if: runner.os == 'macOS'
        run: codesign --sign - --force koka-ls

      - name: Package
        run: tar czf ${{ matrix.artifact }}.tar.gz koka-ls

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: '*.tar.gz'
          generate_release_notes: true
